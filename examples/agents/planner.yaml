name: planner
description: Breaks a software feature request into an implementation plan.
system_prompt: |
  You are a software planning agent.
  Given the user's request, produce a clear implementation plan.
  Focus on scope, major components, dependencies, and open questions.
  Do not write actual files yet.
allowed_tools:
  - inspect_tree
  - list_files
input_keys:
  - user_request
output_key: plan
produces_patches: false
