name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Run lint
        run: ruff check .

      - name: Run CLI smoke test
        run: agentforge run examples/workflows/basic_feature.yaml --input "Add a todo endpoint to a FastAPI app" --no-project-context

      - name: Run Phase 7 iterative dev loop smoke test
        run: |
          TEMP_PROJECT="$(mktemp -d)"
          cp -R examples/sample_project/. "$TEMP_PROJECT/"

          agentforge dev run \
            --project-root "$TEMP_PROJECT" \
            --input "Add a todo endpoint to a FastAPI app" \
            --yes \
            --max-cycles 2

          if [ ! -d ".agentforge/runs" ]; then
            echo "No .agentforge/runs directory found"
            exit 1
          fi

          RUN_DIRECTORY=$(ls -td .agentforge/runs/* | head -n 1)

          if [ -z "$RUN_DIRECTORY" ]; then
            echo "No run directories found"
            exit 1
          fi

          RUN_ID=$(basename "$RUN_DIRECTORY")

          RUN_ID="$RUN_ID" TEMP_PROJECT="$TEMP_PROJECT" python - <<'PY'
          import json
          import os
          from pathlib import Path

          run_id = os.environ["RUN_ID"]
          temp_project = Path(os.environ["TEMP_PROJECT"]).resolve()
          run_directory = Path(".agentforge/runs") / run_id
          summary_path = run_directory / "dev_run_summary.json"
          manifest_path = run_directory / "patch_manifest.json"

          if not summary_path.exists():
              raise SystemExit(f"Missing dev run summary: {summary_path}")
          if not manifest_path.exists():
              raise SystemExit(f"Missing patch manifest: {manifest_path}")

          summary = json.loads(summary_path.read_text())
          manifest = json.loads(manifest_path.read_text())

          if summary.get("project_root") != str(temp_project):
              raise SystemExit(f"Unexpected project root: {summary.get('project_root')!r}")

          if summary.get("max_cycles") != 2:
              raise SystemExit(f"Expected max_cycles=2, got {summary.get('max_cycles')!r}")

          cycles = summary.get("cycles")
          if not isinstance(cycles, list) or not 1 <= len(cycles) <= 2:
              raise SystemExit(f"Expected 1-2 cycles, got {cycles!r}")

          patch_ids = []
          for cycle in cycles:
              cycle_number = cycle.get("cycle")
              generated_patches = cycle.get("generated_patches")
              if not isinstance(generated_patches, list) or not generated_patches:
                  raise SystemExit(f"Cycle {cycle_number} missing generated_patches")

              approval = cycle.get("approval")
              if approval != "approved":
                  raise SystemExit(f"Cycle {cycle_number} expected approved, got {approval!r}")

              applied_patches = cycle.get("applied_patches")
              if not isinstance(applied_patches, list) or not applied_patches:
                  raise SystemExit(f"Cycle {cycle_number} missing applied_patches")

              testing_report = cycle.get("testing_report")
              if cycle.get("test_status") != "not_run":
                  if not isinstance(testing_report, dict):
                      raise SystemExit(f"Cycle {cycle_number} missing testing_report")
                  if not testing_report.get("status"):
                      raise SystemExit(f"Cycle {cycle_number} testing_report missing status")

              planner_decision = cycle.get("planner_decision")
              if not isinstance(planner_decision, dict):
                  raise SystemExit(f"Cycle {cycle_number} missing planner_decision")
              if planner_decision.get("testing_report") != testing_report:
                  raise SystemExit(
                      f"Cycle {cycle_number} planner_decision missing testing_report"
                  )

              patch_ids.extend(
                  patch.get("id")
                  for patch in generated_patches
                  if isinstance(patch, dict)
              )

          if len(patch_ids) != len(set(patch_ids)):
              raise SystemExit(f"Patch IDs collided across cycles: {patch_ids!r}")

          manifest_ids = [
              patch.get("id")
              for patch in manifest
              if isinstance(patch, dict)
          ]
          if len(manifest_ids) != len(set(manifest_ids)):
              raise SystemExit(f"Manifest patch IDs collided: {manifest_ids!r}")

          final_verdict = summary.get("final_verdict")
          if not final_verdict:
              raise SystemExit("Expected a final verdict")

          final_decision = cycles[-1]["planner_decision"]
          final_action = final_decision.get("next_action")
          test_status = summary.get("test_status")

          if test_status == "passed":
              if final_action != "return_final_verdict":
                  raise SystemExit(
                      f"Expected return_final_verdict for passed tests, got {final_action!r}"
                  )
              if summary.get("status") != "tests_passed":
                  raise SystemExit(f"Unexpected passed status: {summary.get('status')!r}")
          elif final_action == "stopped_max_cycles":
              if test_status != "failed":
                  raise SystemExit(f"Expected failed tests at max cycles, got {test_status!r}")
              if len(cycles) != 2:
                  raise SystemExit(f"Expected two cycles at max_cycles, got {len(cycles)}")
              if summary.get("status") != "max_cycles_reached":
                  raise SystemExit(f"Unexpected max-cycle status: {summary.get('status')!r}")
              if "max cycles (2)" not in final_verdict:
                  raise SystemExit(f"Unexpected max-cycle verdict: {final_verdict!r}")
          else:
              raise SystemExit(
                  "Final state was neither tests-passed nor max-cycles-reached: "
                  f"test_status={test_status!r}, action={final_action!r}"
              )

          print("Phase 7 iterative dev loop artifact verified")
          PY

          if [ -n "$(git ls-files -- .agentforge/runs)" ]; then
            echo ".agentforge/runs artifacts must not be committed"
            git ls-files -- .agentforge/runs
            exit 1
          fi

          if ! git diff --quiet; then
            echo "Phase 7 smoke test modified tracked files"
            git diff --name-only
            exit 1
          fi

      - name: Run patch workflow smoke test
        run: |
          agentforge run examples/workflows/basic_feature.yaml \
            --input "Add a todo endpoint to a FastAPI app" \
            --project-root examples/sample_project

          if [ ! -d ".agentforge/runs" ]; then
            echo "No .agentforge/runs directory found"
            exit 1
          fi

          RUN_ID=$(ls -t .agentforge/runs | head -n 1)

          if [ -z "$RUN_ID" ]; then
            echo "No run directories found"
            exit 1
          fi

          echo "Latest run: $RUN_ID"

          agentforge patch list "$RUN_ID"

          PATCH_ID=$(RUN_ID="$RUN_ID" python - <<'PY'
          import json
          import os
          from pathlib import Path

          run_id = os.environ["RUN_ID"]
          manifest_path = Path(".agentforge/runs") / run_id / "patch_manifest.json"

          if not manifest_path.exists():
              raise SystemExit(f"Missing patch manifest: {manifest_path}")

          manifest = json.loads(manifest_path.read_text())

          if not manifest:
              raise SystemExit("No patch proposals generated")

          patch_id = manifest[0].get("id")

          if not patch_id:
              raise SystemExit("No patch ID found in patch manifest")

          print(patch_id)
          PY
          )

          echo "Patch ID: $PATCH_ID"

          agentforge patch show "$RUN_ID" "$PATCH_ID"

          agentforge patch apply --project-root examples/sample_project "$RUN_ID" "$PATCH_ID"

          python - <<'PY'
          import subprocess
          import sys

          result = subprocess.run(
              ["git", "diff", "--name-only", "--", "examples/sample_project"],
              capture_output=True,
              text=True,
              check=True,
          )

          changed_files = [line for line in result.stdout.splitlines() if line.strip()]

          if not changed_files:
              print("Expected patch apply to modify at least one sample project file.")
              sys.exit(1)

          print("Patch apply modified:")
          for file in changed_files:
              print(f"- {file}")
          PY

      - name: Run Phase 5 test execution smoke test
        run: |
          agentforge test detect --project-root examples/sample_project

          # examples/sample_project intentionally has incomplete app dependencies.
          # Use an explicit safe pytest metadata command so CI verifies Phase 5
          # command execution and artifact recording without requiring that sample
          # project's tests to pass.
          agentforge test run \
            --project-root examples/sample_project \
            --command "python -m pytest --version" \
            --timeout 5

          if [ ! -d ".agentforge/test-runs" ]; then
            echo "No .agentforge/test-runs directory found"
            exit 1
          fi

          TEST_RUN_ID=$(ls -t .agentforge/test-runs | head -n 1)

          if [ -z "$TEST_RUN_ID" ]; then
            echo "No test run directories found"
            exit 1
          fi

          echo "Latest test run: $TEST_RUN_ID"

          TEST_RUN_ID="$TEST_RUN_ID" python - <<'PY'
          import json
          import os
          from pathlib import Path

          run_id = os.environ["TEST_RUN_ID"]
          run_directory = Path(".agentforge/test-runs") / run_id
          results_path = run_directory / "test_results.json"
          output_path = run_directory / "test_output.txt"

          if not results_path.exists():
              raise SystemExit(f"Missing test results: {results_path}")

          if not output_path.exists():
              raise SystemExit(f"Missing test output: {output_path}")

          results = json.loads(results_path.read_text())

          expected = {
              "command_source": "user",
              "status": "passed",
              "timed_out": False,
              "timeout_seconds": 5,
              "exit_code": 0,
          }

          for key, value in expected.items():
              actual = results.get(key)
              if actual != value:
                  raise SystemExit(f"Expected {key}={value!r}, got {actual!r}")

          if results.get("selected_command") != ["python", "-m", "pytest", "--version"]:
              raise SystemExit(
                  f"Unexpected selected command: {results.get('selected_command')!r}"
              )

          print("Phase 5 test execution artifact verified")
          PY
