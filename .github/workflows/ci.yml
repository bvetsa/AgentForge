name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Run lint
        run: ruff check .

      - name: Run CLI smoke test
        run: agentforge run examples/workflows/basic_feature.yaml --input "Add a todo endpoint to a FastAPI app" --no-project-context

      - name: Run patch workflow smoke test
        run: |
          agentforge run examples/workflows/basic_feature.yaml \
            --input "Add a todo endpoint to a FastAPI app" \
            --project-root examples/sample_project

          if [ ! -d ".agentforge/runs" ]; then
            echo "No .agentforge/runs directory found"
            exit 1
          fi

          RUN_ID=$(ls -t .agentforge/runs | head -n 1)

          if [ -z "$RUN_ID" ]; then
            echo "No run directories found"
            exit 1
          fi

          echo "Latest run: $RUN_ID"

          agentforge patch list "$RUN_ID"

          PATCH_ID=$(RUN_ID="$RUN_ID" python - <<'PY'
          import json
          import os
          from pathlib import Path

          run_id = os.environ["RUN_ID"]
          manifest_path = Path(".agentforge/runs") / run_id / "patch_manifest.json"

          if not manifest_path.exists():
              raise SystemExit(f"Missing patch manifest: {manifest_path}")

          manifest = json.loads(manifest_path.read_text())

          if not manifest:
              raise SystemExit("No patch proposals generated")

          patch_id = manifest[0].get("id")

          if not patch_id:
              raise SystemExit("No patch ID found in patch manifest")

          print(patch_id)
          PY
          )

          echo "Patch ID: $PATCH_ID"

          agentforge patch show "$RUN_ID" "$PATCH_ID"

          agentforge patch apply --project-root examples/sample_project "$RUN_ID" "$PATCH_ID"

          python - <<'PY'
          import subprocess
          import sys

          result = subprocess.run(
              ["git", "diff", "--name-only", "--", "examples/sample_project"],
              capture_output=True,
              text=True,
              check=True,
          )

          changed_files = [line for line in result.stdout.splitlines() if line.strip()]

          if not changed_files:
              print("Expected patch apply to modify at least one sample project file.")
              sys.exit(1)

          print("Patch apply modified:")
          for file in changed_files:
              print(f"- {file}")
          PY
